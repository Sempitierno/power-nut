<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - PowertNut</title>
    <link rel="stylesheet" href="./assets/carrito.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="logo">
            <span class="logo-icon">🥜</span> 
            <span class="logo-text">PowertNut</span>
        </div>
        
        <nav class="nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html#catalogo">Productos</a></li>
                <li><a href="carrito.html" class="active">Carrito</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <a href="carrito.html" class="cart-btn"><span class="cart-icon">🛒</span> Cart (0)</a>
            <a href="login.html" class="login-btn">Iniciar sesión</a>
            <a href="registro.html" class="register-btn">Registrarse</a>
        </div>
    </header>

    <main class="minimal-container">
        <h2 class="cart-title">Tu carrito de compras</h2>
        
        <div class="cart-layout">
            <div id="lista-carrito" class="cart-items">
                <!-- Los productos con su imagen se inyectan aquí con JS -->
            </div>
            
            <div class="cart-summary">
                <h3>Resumen del pedido</h3>
                <div class="total-row">
                    <span>TOTAL:</span>
                    <span id="cart-total">$0</span>
                </div>
                <button class="btn btn-primary full-width" onclick="alert('¡Simulación de pago exitosa!')">Proceder al pago</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
