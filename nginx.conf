server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Llamadas al backend: nginx las reenvía al API Gateway (puerto 8080 de la misma EC2).
    # Así el navegador habla con un solo origen (puerto 80) y no hay CORS.
    location ~ ^/(auth|users|products|api)(/|$) {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin "";
    }

    # Rutas de React Router (/login, /carrito, /admin/productos...): siempre index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
