<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - PowertNut</title>
    <link rel="stylesheet" href="./assets/formularios.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <!-- Asume que tienes un icono para el logo, aquí usamos un placeholder textual -->
            <span class="logo-icon">🥜</span> 
            <span class="logo-text">PowertNut</span>
        </div>
        
        <nav class="nav">
            <ul>
                <li><a href="index.html" class="active">Inicio</a></li>
                <li><a href="index.html">Productos</a></li>
                <li><a href="carrito.html">Carrito</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <a href="carrito.html" class="cart-btn"><span class="cart-icon">🛒</span> Cart (0)</a>
            <a href="login.html" class="login-btn">Iniciar sesión</a>
            <a href="registro.html" class="register-btn">Registrarse</a>
        </div>
    </header>

    <main class="minimal-container">
        <div class="form-box">
            <h2>Iniciar sesión</h2>
            <form id="form-login">
                <label for="log-correo">Correo electrónico</label>
                <input type="email" id="log-correo" required>
                <span class="error-msg" id="err-log-correo"></span>

                <label for="log-pass">Contraseña</label>
                <input type="password" id="log-pass" required>
                <span class="error-msg" id="err-log-pass"></span>

                <button type="submit" class="btn btn-primary full-width">Entrar</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
